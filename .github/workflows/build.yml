name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true
      ref:
        description: "Commit to build after upstream synchronization."
        type: string
        required: false
        default: ""

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          submodules: true

      - name: Save previous changelog
        shell: bash
        run: |
          set -euo pipefail
          if git show origin/update:build.md > build.previous.md; then
            echo "Saved origin/update:build.md for per-source recovery."
          else
            rm -f build.previous.md
            echo "No previous update/build.md exists; failed sources will keep no new patch marker."
          fi

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Clear previous build outputs
        run: rm -rf -- build .build-abi-manifests

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove universal intermediate APKs
        run: find build -maxdepth 1 -type f -name '*-all.apk' -delete

      - name: Finalize build status and changelog
        id: get_output
        shell: bash
        run: |
          set -euo pipefail
          config_file=config.toml
          if [[ -f config.json ]]; then config_file=config.json; fi
          python3 scripts/finalize_build.py \
            --config "$config_file" \
            --build-dir build \
            --manifest-dir .build-abi-manifests \
            --current-changelog build.md \
            --previous-changelog build.previous.md \
            --status-file build-status.json

          python3 scripts/validate_built_apks.py \
            --config "$config_file" \
            --build-dir build \
            --manifest-dir .build-abi-manifests \
            --status-file build-status.json \
            --current-changelog build.md \
            --previous-changelog build.previous.md

          output() {
            local key="$1" value="$2" delimiter
            delimiter="$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_OUTPUT"
          }

          release() {
            local key="$1" files="$2" version_re="$3" patch_re="$4" cli_re="$5"
            local repo="$6" cli_name="$7" patch_name="$8" microg="$9" suffix="${10}"
            compgen -G "$files" >/dev/null || return 0

            if ! jq -e --arg brand "$suffix" '.brands[$brand].complete == true' build-status.json >/dev/null; then
              echo "Incomplete APK set for $key ($suffix); skipping partial release."
              return 0
            fi

            local version patch cli body
            version="$(grep -Pom1 "$version_re" build.md || true)"
            patch="$(grep -Pom1 "$patch_re" build.md || true)"
            cli="$(grep -Pom1 "$cli_re" build.md || true)"
            [[ -n "$version" && -n "$patch" && -n "$cli" ]] || {
              echo "Missing release metadata for $key" >&2
              return 1
            }
            printf -v body '%s\n%s\nCLI: %s %s\nPatches: %s %s\nInstall [Microg](%s) for non-root YouTube' \
              "$version" "[Changelog](https://github.com/$repo/releases/tag/v$patch)" \
              "$cli_name" "$cli" "$patch_name" "$patch" "$microg"
            output "${key}_LOG" "$body"
            printf '%s_TAG=%s-%s\n' "$key" "$patch" "$suffix" >> "$GITHUB_OUTPUT"
          }

          release RVX './build/*rvx-anddea.apk' '(?<=a: ).*' '(?<=a\/revanced-patches\/patches-).*(?=\.mpp)' '(?<=p\/morphe-cli\/morphe-desktop-).*((?=-all\.jar)|(?=(?<!-all)\.jar))' \
            anddea/revanced-patches Morphe anddea https://github.com/MorpheApp/MicroG-RE/releases rvx-anddea
          release RV './build/*rv.apk' '(?<=v: ).*' '(?<=d\/revanced-patches\/patches-).*(?=\.rvp)' '(?<=d\/revanced-cli\/revanced-cli-).*((?=-all\.jar)|(?=(?<!-all)\.jar))' \
            ReVanced/revanced-patches ReVanced ReVanced https://github.com/MorpheApp/MicroG-RE/releases rv
          release MORPHE './build/*morphe.apk' '(?<=e: ).*' '(?<=p\/morphe-patches\/patches-).*(?=\.mpp)' '(?<=p\/morphe-cli\/morphe-desktop-).*((?=-all\.jar)|(?=(?<!-all)\.jar))' \
            MorpheApp/morphe-patches Morphe Morphe https://github.com/MorpheApp/MicroG-RE/releases morphe
          release RVX_A6_7 './build/*rvx-a6-7.apk' '(?<=7: ).*' '(?<=1\/revanced-patches-android6-7\/patches-).*(?=\.rvp)' '(?<=0\/revanced-cli\/revanced-cli-).*((?=-all\.jar)|(?=(?<!-all)\.jar))' \
            kitadai31/revanced-patches-android6-7 inotia00 kitadai31 https://github.com/ReVanced/GmsCore/releases rvx-a6-7

          cp -f build.md build.tmp

      - name: Upload releases
        id: upload_releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RVX_A6_7_TAG: ${{ steps.get_output.outputs.RVX_A6_7_TAG }}
          RVX_A6_7_LOG: ${{ steps.get_output.outputs.RVX_A6_7_LOG }}
          RV_TAG: ${{ steps.get_output.outputs.RV_TAG }}
          RV_LOG: ${{ steps.get_output.outputs.RV_LOG }}
          MORPHE_TAG: ${{ steps.get_output.outputs.MORPHE_TAG }}
          MORPHE_LOG: ${{ steps.get_output.outputs.MORPHE_LOG }}
          RVX_TAG: ${{ steps.get_output.outputs.RVX_TAG }}
          RVX_LOG: ${{ steps.get_output.outputs.RVX_LOG }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          published_tags_file="$RUNNER_TEMP/published-release-tags.txt"
          : > "$published_tags_file"

          upload_release() {
            local tag="$1"
            local title="$2"
            local body="$3"
            local latest="$4"
            shift 4
            local files=("$@")

            if [[ -z "$tag" ]]; then
              echo "Missing release tag for: $title" >&2
              return 1
            fi
            if (( ${#files[@]} == 0 )); then
              echo "No build files found for: $title ($tag)" >&2
              return 1
            fi

            echo "Publishing $title ($tag)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes "$body"
              gh release upload "$tag" "${files[@]}" --clobber
              local release_id
              release_id="$(gh release view "$tag" --json databaseId --jq '.databaseId')"
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH -f "make_latest=$latest" >/dev/null
            else
              gh release create "$tag" "${files[@]}" --title "$title" --notes "$body" "--latest=$latest"
            fi
            printf '%s\n' "$tag" >> "$published_tags_file"
          }

          if [[ -n "$RVX_A6_7_LOG" ]]; then
            files=(./build/*rvx-a6-7.apk)
            upload_release "$RVX_A6_7_TAG" "ReVanced Extended Android6-7" "$RVX_A6_7_LOG" false "${files[@]}"
          fi
          if [[ -n "$RV_LOG" ]]; then
            files=(./build/*rv.apk)
            upload_release "$RV_TAG" "ReVanced" "$RV_LOG" false "${files[@]}"
          fi
          if [[ -n "$MORPHE_LOG" ]]; then
            files=(./build/*morphe.apk)
            upload_release "$MORPHE_TAG" "Morphe" "$MORPHE_LOG" true "${files[@]}"
          fi
          if [[ -n "$RVX_LOG" ]]; then
            files=(./build/*rvx-anddea.apk)
            upload_release "$RVX_TAG" "ReVanced Extended anddea" "$RVX_LOG" false "${files[@]}"
          fi

          delimiter="$(openssl rand -hex 16)"
          {
            printf 'PUBLISHED_TAGS<<%s\n' "$delimiter"
            cat "$published_tags_file"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Update changelog
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md

      - name: Commit changelog to update branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- build.md

          if git diff --cached --quiet; then
            echo "build.md did not change; no changelog commit is needed."
          else
            git commit -m "Update build log"
            git push origin HEAD:update
          fi

      - name: Keep latest two releases per variant
        if: ${{ steps.upload_releases.outputs.PUBLISHED_TAGS != '' }}
        uses: actions/github-script@v9
        env:
          PUBLISHED_TAGS: ${{ steps.upload_releases.outputs.PUBLISHED_TAGS }}
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 }
            );

            const config = [
              { suffix: '-rv', keep: 2 },
              { suffix: '-morphe', keep: 2 },
              { suffix: '-rvx-anddea', keep: 2 },
              { suffix: '-rvx-a6-7', keep: 2 },
            ];

            async function deleteOrWarnIfMissing(label, request) {
              try {
                await request();
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`${label} was already absent (404); continuing.`);
                  return;
                }
                throw error;
              }
            }

            core.info(`Found ${releases.length} releases across all pages.`);

            const publishedTags = new Set(
              (process.env.PUBLISHED_TAGS || '')
                .split(/\\r?\\n/)
                .map((tag) => tag.trim())
                .filter(Boolean)
            );

            for (const { suffix, keep } of config) {
              const family = releases
                .filter((release) => release.tag_name.endsWith(suffix))
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

              const justPublished = family.filter((release) => publishedTags.has(release.tag_name));
              if (justPublished.length === 0) {
                core.info(suffix + ': no release published by this run; pruning skipped.');
                continue;
              }

              const keepTags = new Set(justPublished.map((release) => release.tag_name));
              for (const release of family) {
                if (keepTags.size >= keep) break;
                keepTags.add(release.tag_name);
              }
              const targets = family.filter((release) => !keepTags.has(release.tag_name));
              core.info(`${suffix}: keeping ${keepTags.size}, deleting ${targets.length}.`);

              for (const release of targets) {
                core.info(`Deleting old release ${release.tag_name} (${release.created_at}).`);
                await deleteOrWarnIfMissing(
                  `Release ${release.tag_name}`,
                  () => github.rest.repos.deleteRelease({
                    ...context.repo,
                    release_id: release.id,
                  })
                );
                await deleteOrWarnIfMissing(
                  `Tag ${release.tag_name}`,
                  () => github.rest.git.deleteRef({
                    ...context.repo,
                    ref: `tags/${release.tag_name}`,
                  })
                );
              }
            }

